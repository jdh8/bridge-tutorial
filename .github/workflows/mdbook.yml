name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Install mdbook
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: mdbook
      - name: Install mdbook-abbr
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: mdbook-abbr
      - name: Install mdbook-replace
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: mdbook-replace
      - name: Install PDF toolchain  # explicit lmodern, plain-generic (ulem) and fonts-recommended (pzdr): neither apt nor the cache pulls them in
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-lang-chinese fonts-noto-cjk librsvg2-bin lmodern texlive-plain-generic texlive-fonts-recommended
          version: 1.0
          execute_install_scripts: true  # TeX Live builds its formats in postinst
      - name: Install Libertinus  # Ubuntu has no Libertinus package; fetch the release OTFs
        run: |
          curl -sLO https://github.com/alerque/libertinus/releases/download/v7.051/Libertinus-7.051.zip
          unzip -qj Libertinus-7.051.zip '*.otf' -d ~/.fonts && fc-cache -f
      - run: mdbook build
      - run: python3 print.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
